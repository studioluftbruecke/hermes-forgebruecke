name: forgebruecke
version: "0.0.25"
description: "A bridge between Hermes and your self-hosted Forgejo. Hermes works as its own account, writes follow Hermes' approval setting, and a desk shows the pull requests that wait for you."
author: "Studio Luftbrücke"
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - forgejo_doctor
  - forgejo_get
  - forgejo_list
  - forgejo_comment
  - forgejo_create_pr
  - forgejo_status
  - forgejo_flows
  - forgejo_repos
provides_hooks:
  - pre_tool_call
  - post_approval_response
  - transform_llm_output
config_schema:
  url:
    type: string
    label: "Forgejo address"
    description: "The address you open your Forgejo at, for example https://forgejo.example.com."
  token:
    type: secret
    env: FORGEBRUECKE_BOT_ACCOUNT_TOKEN
    label: "Hermes' account token"
    description: "A token of Hermes' account, created for all repositories with read:notification, write:issue, write:repository and read:user."
  you:
    type: string
    default: ""
    label: "Your Forgejo login"
    description: "Your own user name on Forgejo, so the desk lists the pull requests that wait for your review."
  owner_token:
    type: secret
    env: FORGEBRUECKE_PERSONAL_WRITE_TOKEN
    label: "Your write token (optional)"
    description: "For the desk's Merge and Comment buttons; it is also exposed to Hermes, ultimately giving Hermes full access to your account."
  poll_interval:
    type: integer
    default: 30
    label: "Check Forgejo every (seconds)"
    description: "How often mentions and flows are checked, from 30 to 3600 seconds."
  mention_authors:
    type: list
    default: []
    label: "Who may mention Hermes"
    description: "Users whose mentions Hermes answers; empty means everyone with write access to the repo."
  writes:
    type: list
    default: []
    label: "Flows and mentions per repo"
    description: "One rule per repo: which flows run there and whether Hermes answers mentions; a rule grants no access."
  flows_path:
    type: string
    default: ".forgebruecke/flows.yml"
    label: "Flow file in each repo"
    description: "The path of the flow file inside each repository."
  audit_enabled:
    type: boolean
    default: false
    label: "Security audit"
    description: "A read-only check of branch protection, required checks, deploy keys and public repos."
  learn_mode:
    type: boolean
    default: false
    label: "Learn mode"
    description: "A short Git lesson after your first pull request, your first failed check and your first merge."
  default_review_profile:
    type: string
    default: ""
    label: "Profile that runs agent reviews"
    description: "The Hermes profile a flow's review gate uses when the flow names none; empty means this profile."
  review_every_pr:
    type: boolean
    default: true
    label: "Ask me to review every pull request"
    description: "Hermes asks you to review every open pull request where it may write, without an approval card."
  dry_run:
    type: boolean
    default: true
    label: "Preview only (Hermes writes nothing)"
    description: "Hermes shows each comment, pull request and check it would send, and sends none."
